<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2c84b"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: dark square with iOS-style rounding -->
  <rect width="512" height="512" rx="88" ry="88" fill="#0a0a0a"/>

  <!-- Subtle amber border -->
  <rect width="512" height="512" rx="88" ry="88"
        fill="none" stroke="#d4a017" stroke-width="2" stroke-opacity="0.22"/>

  <!-- J — thick stroke, round caps, clean curve -->
  <!-- Center of stem at x=272. Hook curves left, ending open at upper-left. -->
  <path
    d="M 272 82
       L 272 322
       C 272 412, 220 452, 168 436
       C 132 424, 116 394, 128 368"
    fill="none"
    stroke="url(#gold)"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Musical flag at top of stem — curves right like an eighth-note flag -->
  <!-- Starts at top-right of stem, arcs out and back -->
  <path
    d="M 308 82
       C 356 62, 392 88, 384 132
       C 376 172, 342 184, 308 174"
    fill="none"
    stroke="url(#gold)"
    stroke-width="22"
    stroke-linecap="round"
    filter="url(#glow)"/>
</svg>
